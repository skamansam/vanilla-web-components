# This file exists solely to mark this directory as its own pnpm workspace
# root. Without it, pnpm walks up the directory tree, finds the unrelated
# pnpm-workspace.yaml at /home/sam/workspace-other (which does not list this
# project), and silently operates on that outer workspace instead of this
# project -- so this project's own pnpm-lock.yaml never gets updated and
# dependencies can get resolved from the wrong node_modules.
# See: https://github.com/pnpm/pnpm/issues/11656
